spring.application.name=portfolio

# Carga el .env de la raíz del proyecto (si no existe, no falla)
spring.config.import=optional:file:.env[.properties]

# Conexión a Mongo (los valores salen del .env)
spring.mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@127.0.0.1:${MONGO_PORT}/${MONGO_DB_NAME}?authSource=admin